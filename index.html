<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }

  #continue {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border: none;
    cursor: pointer;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: clamp(2.5rem, 10vw, 8rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
    background-size: 200% 200%;
    animation: shift 8s ease infinite;
    transition: filter 0.2s ease, transform 0.1s ease;
  }
  #continue:hover { filter: brightness(1.15); }
  #continue:active { transform: scale(0.99); }
  #continue:focus-visible { outline: 6px solid #fff; outline-offset: -12px; }

  @keyframes shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body>
  <button id="continue" type="button">Continue</button>

<script>
  // ---- CONFIG -------------------------------------------------------
  // The hub page (your custom game layout) that loads inside the about:blank tab.
  var TARGET_URL = new URL("hub.html", window.location.href).href + "?v=" + Date.now();
  // Where THIS tab goes after the redirect.
  var DECOY_URL = "https://classroom.google.com";
  // -------------------------------------------------------------------

  function launch() {
    var win = window.open("about:blank", "_blank");
    if (!win) return false; // popup blocked

    var doc = win.document;
    doc.title = "School Hub";
    doc.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#0f172a;";
    var frame = doc.createElement("iframe");
    frame.src = TARGET_URL;
    frame.style.cssText = "border:none;width:100%;height:100%;";
    frame.setAttribute("allow", "fullscreen; autoplay");
    doc.body.appendChild(frame);

    window.location.replace(DECOY_URL);
    return true;
  }

  // Button click always works.
  document.getElementById("continue").addEventListener("click", function () {
    if (!launch()) window.location.href = TARGET_URL; // blocked: open hub in this tab
  });

  // Try automatically on load; browsers often block this, so the button is the fallback.
  window.addEventListener("load", launch);
</script>
</body>
</html>
